<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SyaizZ — developer signal console</title>
  <desc id="desc">An animated dark developer console with scanning light, orbiting data nodes, and changing build signals.</desc>

  <defs>
    <linearGradient id="bg" x1="35" y1="18" x2="1140" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D17"/>
      <stop offset="0.5" stop-color="#080B13"/>
      <stop offset="1" stop-color="#0D1020"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59F3D4" stop-opacity="0.7"/>
      <stop offset="0.48" stop-color="#59F3D4" stop-opacity="0.05"/>
      <stop offset="0.7" stop-color="#8B83FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF9A62" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="name" x1="80" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFF"/>
      <stop offset="0.56" stop-color="#DCE6F7"/>
      <stop offset="1" stop-color="#8B83FF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59F3D4" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#59F3D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#59F3D4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(952 220) rotate(90) scale(68)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#192838"/>
      <stop offset="0.68" stop-color="#101522"/>
      <stop offset="1" stop-color="#090C15"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#AFC0DB" stroke-opacity="0.055"/>
      <circle cx="0" cy="0" r="1" fill="#59F3D4" fill-opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="nameReveal">
      <rect x="76" y="138" width="610" height="94" rx="2">
        <animate attributeName="width" from="0" to="610" dur="1.35s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="0" y="0" width="1200" height="460" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
    <rect width="1200" height="460" fill="url(#grid)"/>

    <circle cx="1035" cy="-40" r="260" fill="#8B83FF" fill-opacity="0.065" filter="url(#softGlow)">
      <animate attributeName="fill-opacity" values="0.045;0.09;0.045" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="104" cy="470" r="220" fill="#59F3D4" fill-opacity="0.045" filter="url(#softGlow)">
      <animate attributeName="fill-opacity" values="0.03;0.075;0.03" dur="8.5s" repeatCount="indefinite"/>
    </circle>

    <rect x="-260" y="0" width="260" height="460" fill="url(#beam)" transform="skewX(-12)">
      <animate attributeName="x" values="-320;1380" dur="6.5s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1"/>
    </rect>

    <path d="M0 74H1200" stroke="#AFC0DB" stroke-opacity="0.09"/>
    <path d="M733 74V392" stroke="#AFC0DB" stroke-opacity="0.08" stroke-dasharray="4 9"/>
    <path d="M0 392H1200" stroke="#AFC0DB" stroke-opacity="0.09"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <circle cx="82" cy="42" r="4" fill="#59F3D4" filter="url(#glow)">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="3;4.8;3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="47" fill="#BFCBE0" font-size="12" letter-spacing="2.2">SIGNAL://SYAIZZ</text>
      <text x="1090" y="47" text-anchor="end" fill="#71809A" font-size="11" letter-spacing="1.6">INDONESIA</text>
      <path d="M1110 42H1128" stroke="#FF9A62" stroke-width="2" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <g clip-path="url(#nameReveal)">
      <text x="78" y="217" fill="url(#name)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="86" font-weight="800" letter-spacing="10">SYAIZZ</text>
      <path d="M82 234H590" stroke="url(#edge)" stroke-width="2"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="82" y="117" fill="#59F3D4" font-size="13" letter-spacing="2.4">BUILDER OF CONNECTED EXPERIENCES</text>
      <text x="82" y="270" fill="#95A3BA" font-size="16" letter-spacing="0.6">web platforms / mobile apps / game systems</text>
      <text x="82" y="305" fill="#637089" font-size="13">turning ambitious ideas into things people can actually use.</text>

      <g transform="translate(82 337)">
        <rect width="112" height="29" rx="14.5" fill="#59F3D4" fill-opacity="0.07" stroke="#59F3D4" stroke-opacity="0.28"/>
        <circle cx="16" cy="14.5" r="3" fill="#59F3D4"/>
        <text x="28" y="19" fill="#BDEEE5" font-size="10" letter-spacing="1.2">TYPESCRIPT</text>

        <rect x="124" width="105" height="29" rx="14.5" fill="#8B83FF" fill-opacity="0.07" stroke="#8B83FF" stroke-opacity="0.28"/>
        <circle cx="140" cy="14.5" r="3" fill="#8B83FF"/>
        <text x="152" y="19" fill="#D3D0FF" font-size="10" letter-spacing="1.2">REACT NATIVE</text>

        <rect x="241" width="94" height="29" rx="14.5" fill="#FF9A62" fill-opacity="0.07" stroke="#FF9A62" stroke-opacity="0.28"/>
        <circle cx="257" cy="14.5" r="3" fill="#FF9A62"/>
        <text x="269" y="19" fill="#FFD0B7" font-size="10" letter-spacing="1.2">NODE.JS</text>

        <rect x="347" width="78" height="29" rx="14.5" fill="#AFC0DB" fill-opacity="0.05" stroke="#AFC0DB" stroke-opacity="0.2"/>
        <circle cx="363" cy="14.5" r="3" fill="#AFC0DB"/>
        <text x="375" y="19" fill="#CED8E8" font-size="10" letter-spacing="1.2">LINUX</text>
      </g>
    </g>

    <g>
      <circle cx="952" cy="220" r="129" stroke="#8B83FF" stroke-opacity="0.14" stroke-dasharray="2 12">
        <animate attributeName="stroke-dashoffset" values="0;-84" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="952" cy="220" r="102" stroke="#59F3D4" stroke-opacity="0.32" stroke-dasharray="36 10 4 10">
        <animate attributeName="stroke-dashoffset" values="0;120" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="952" cy="220" r="78" stroke="#FF9A62" stroke-opacity="0.22" stroke-dasharray="7 11">
        <animate attributeName="stroke-dashoffset" values="0;-72" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="952" cy="220" r="60" fill="url(#core)" stroke="#AFC0DB" stroke-opacity="0.16"/>
      <circle cx="952" cy="220" r="46" stroke="#59F3D4" stroke-opacity="0.08">
        <animate attributeName="r" values="42;56;42" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.2;0;0.2" dur="3.8s" repeatCount="indefinite"/>
      </circle>

      <text x="952" y="239" text-anchor="middle" fill="#F4F7FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="800">S</text>
      <text x="952" y="268" text-anchor="middle" fill="#59F3D4" font-family="ui-monospace, monospace" font-size="9" letter-spacing="2">CORE</text>

      <circle r="5" fill="#59F3D4" filter="url(#glow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M952 118 A102 102 0 1 1 951.9 118"/>
      </circle>
      <circle r="4" fill="#FF9A62" filter="url(#glow)">
        <animateMotion dur="5.5s" begin="-2.2s" repeatCount="indefinite" path="M952 142 A78 78 0 1 0 951.9 142"/>
      </circle>

      <g fill="#8B83FF">
        <circle cx="1074" cy="179" r="3">
          <animate attributeName="r" values="2;5;2" dur="2.7s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="842" cy="286" r="3">
          <animate attributeName="r" values="2;4.5;2" dur="3.1s" begin="-1s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0.35;1;0.35" dur="3.1s" begin="-1s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="1112" y="103" text-anchor="end" fill="#64728B" font-size="10" letter-spacing="1.6">ACTIVE NODE</text>
      <path d="M1078 112H1112" stroke="#59F3D4" stroke-opacity="0.45"/>

      <g transform="translate(788 326)">
        <rect width="328" height="42" rx="10" fill="#111623" stroke="#AFC0DB" stroke-opacity="0.12"/>
        <circle cx="18" cy="21" r="3" fill="#59F3D4">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" repeatCount="indefinite"/>
        </circle>

        <g>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.29;0.34;1" dur="10.5s" repeatCount="indefinite"/>
          <text x="34" y="18" fill="#64728B" font-size="8" letter-spacing="1.3">NOW BUILDING</text>
          <text x="34" y="31" fill="#DDE5F2" font-size="11" letter-spacing="0.7">PERFORMANCE-FIRST MOBILE</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.35;0.62;0.66;1" dur="10.5s" repeatCount="indefinite"/>
          <text x="34" y="18" fill="#64728B" font-size="8" letter-spacing="1.3">SIGNAL ROUTE</text>
          <text x="34" y="31" fill="#DDE5F2" font-size="11" letter-spacing="0.7">CONNECTED GAME WORLDS</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.68;1" dur="10.5s" repeatCount="indefinite"/>
          <text x="34" y="18" fill="#64728B" font-size="8" letter-spacing="1.3">DEFAULT LOOP</text>
          <text x="34" y="31" fill="#DDE5F2" font-size="11" letter-spacing="0.7">BUILD / MEASURE / REFINE</text>
        </g>
      </g>

      <text x="82" y="425" fill="#526078" font-size="10" letter-spacing="1.6">SYS.STATUS</text>
      <text x="174" y="425" fill="#59F3D4" font-size="10" letter-spacing="1.2">ONLINE</text>
      <text x="805" y="425" fill="#526078" font-size="10" letter-spacing="1.4">IDEAS IN MOTION</text>
      <rect x="935" y="417" width="177" height="3" rx="1.5" fill="#1A2233"/>
      <rect x="935" y="417" width="36" height="3" rx="1.5" fill="#59F3D4">
        <animate attributeName="x" values="935;1076;935" dur="4.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="fill" values="#59F3D4;#8B83FF;#FF9A62;#59F3D4" dur="8.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="458" rx="27" stroke="url(#edge)" stroke-opacity="0.48"/>
</svg>
